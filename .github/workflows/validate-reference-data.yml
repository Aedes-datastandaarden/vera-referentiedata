name: Validate reference data

on:
  pull_request:
    branches:
      - main
    paths:
      - "Referentiedata.csv"
      - ".github/scripts/validate_reference_data.py"
      - ".github/workflows/validate-reference-data.yml"

permissions:
  contents: read

jobs:
  validate-reference-data:
    name: Validate reference data CSV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # - name: Retrieve CSV from base branch
      #   env:
      #     BASE_SHA: ${{ github.event.pull_request.base.sha }}
      #   run: |
      #     git show "${BASE_SHA}:Referentiedata.csv" > /tmp/referentiedata-base.csv

      - name: Extract reference data from target branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          echo "Event: ${{ github.event_name }}"
          echo "Base ref: ${{ github.event.pull_request.base.ref }}"
          echo "Base SHA: ${BASE_SHA}"

          echo "Current checkout:"
          git rev-parse HEAD

          echo "Checking whether the base commit exists:"
          git cat-file -t "${BASE_SHA}"

          echo "Checking whether the CSV exists in the base commit:"
          git cat-file -e "${BASE_SHA}:referentiedata.csv"

          git show "${BASE_SHA}:referentiedata.csv" \
            > /tmp/referentiedata-base.csv

          echo "Base CSV size:"
          wc -c /tmp/referentiedata-base.csv

          echo "Base CSV header:"
          head -n 1 /tmp/referentiedata-base.csv | cat -A

          echo "Current CSV header:"
          head -n 1 referentiedata.csv | cat -A
    
      - name: Validate reference data
        run: |
          python .github/scripts/validate_reference_data.py \
            --base-file /tmp/referentiedata-base.csv \
            --current-file Referentiedata.csv